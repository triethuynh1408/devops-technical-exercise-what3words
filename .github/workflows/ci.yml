name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The Go service. Not a Go exercise, but the image is only as good as what
  # goes into it: run the suite the README documents, plus vet and a race
  # check, and fail fast with readable output rather than only inside the
  # docker build.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26" # current toolchain; go.mod's `go 1.22` is only a floor
          cache: false # no third-party deps, nothing to cache
      - run: go vet ./...
      - run: go test -race -cover ./...

  # ---------------------------------------------------------------------------
  # The image. Lint the Dockerfile, build it exactly as a release would
  # (the build stage re-runs the tests), then scan the result — "assume this
  # image will be pulled by a cluster you care about".
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: greeter:ci
          build-args: VERSION=ci
          provenance: false
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: greeter:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # The chart. Lint, then render both environments and validate the output
  # against the Kubernetes API schemas so a bad field is caught here, not on
  # apply.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint (both environments)
        run: |
          helm lint deploy/greeter -f deploy/greeter/values-dev.yaml
          helm lint deploy/greeter -f deploy/greeter/values-prod.yaml
      - name: install kubeconform
        run: |
          curl -sSLo /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
      - name: render + validate
        run: |
          for env in dev prod; do
            echo "== $env =="
            helm template greeter deploy/greeter -f deploy/greeter/values-$env.yaml \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 -schema-location default
          done

  # ---------------------------------------------------------------------------
  # The Terraform. Formatting and a provider-backed validate for each
  # environment root. No backend, no apply.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - name: validate dev + prod
        run: |
          for env in dev prod; do
            echo "== $env =="
            terraform -chdir="terraform/environments/$env" init -backend=false -input=false
            terraform -chdir="terraform/environments/$env" validate
          done

  # ---------------------------------------------------------------------------
  # The shell scripts (cluster + evidence helpers). shellcheck is preinstalled
  # on the runner.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck cluster/*.sh scripts/*.sh
