apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "greeter.fullname" . }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
# All application config lives here, not in the image. Changing any of these and
# running `helm upgrade` rolls the pods (see the checksum annotation on the
# Deployment). Values are strings because that is what the container env is.
data:
  GREETING_NAME: {{ .Values.config.greetingName | quote }}
  PORT: {{ .Values.config.port | quote }}
  VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  WARMUP_SECONDS: {{ .Values.config.warmupSeconds | quote }}
  SHUTDOWN_DELAY_SECONDS: {{ .Values.config.shutdownDelaySeconds | quote }}
  DRAIN_TIMEOUT_SECONDS: {{ .Values.config.drainTimeoutSeconds | quote }}
