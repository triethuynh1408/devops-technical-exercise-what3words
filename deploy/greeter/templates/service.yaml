apiVersion: v1
kind: Service
metadata:
  name: {{ include "greeter.fullname" . }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # A NodePort only ever forwards to Ready pods, so the readiness-based drain
  # in the app translates directly into "stop getting new traffic here".
  selector:
    {{- include "greeter.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # Pinned so cluster/kind-config.yaml can map it to localhost:8080.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
